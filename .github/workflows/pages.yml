name: Pages

# Builds https://browser-specs.github.io/ from upstream data and publishes it: browser-specs' list of specs, webref's
# crawl (for each spec's date, and each spec's footprint), web-features (for the category guesses), the start of each
# spec's page (for its abstract and editors), and the four data files Web Specs Companion builds every hour from BCD,
# mdn/content, caniuse-db, and wpt.fyi. It runs on each push to main, on demand, after each of Web Specs Companion's
# hourly builds, which asks for it with trigger=wsc, and on an hourly schedule too, since GitHub skips scheduled runs at
# times. A run that Web Specs Companion or the schedule started deploys only when the data has changed. GitHub turns off
# a public repo's workflows after 60 days with no activity in the repo, and nothing commits to this one on its own, so
# each of those runs turns the workflow back on.

on:
  push:
    branches: [main]
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:
    inputs:
      trigger:
        description: "What started the run: wsc for Web Specs Companion's hourly build, which deploys only on a change"
        default: manual

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    outputs:
      deploy: ${{ steps.compare.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # The token lets the build read the spec repos' contributors, to find the editors' GitHub accounts.
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Compare the site with the deployed one
        id: compare
        env:
          ROUTINE: ${{ github.event_name == 'schedule' || inputs.trigger == 'wsc' }}
        run: |
          site=https://browser-specs.github.io
          # A file that's missing from the deployed site, or that fails to download, counts as changed.
          same() { cmp -s <(curl -fsS "$site/$1" | jq -S "$2") <(jq -S "$2" "_site/$1"); }
          if [ "$ROUTINE" = true ] \
            && same data/specs.json 'del(.sources.built)' \
            && same data/panels/missing.json . && same data/panels/mdn.json . \
            && same data/panels/caniuse.json . && same data/panels/wpt.json . \
            && same data/panels/footprint.json . && same data/panels/spec.json .; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Keep the workflow turned on
        if: github.event_name == 'schedule' || inputs.trigger == 'wsc'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/enable"
      - uses: actions/upload-pages-artifact@v5
        if: steps.compare.outputs.deploy == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
