name: Pages

# Builds https://html-now.github.io/ from upstream data and publishes it: browser-specs' list of specs, webref's crawl
# (for each spec's date), web-features (for the category guesses), and the four data files Web Specs Companion builds
# every hour from BCD, mdn/content, caniuse-db, and wpt.fyi. It runs on each push to main, on demand, and every hour, at
# a minute after Web Specs Companion's own hourly deploy has landed, and an hourly run deploys only when the data has
# changed. GitHub turns off a public repo's scheduled workflows after 60 days with no activity in the repo, and nothing
# commits to this one on its own, so each scheduled run turns its own workflow on again, which resets that count.

on:
  push:
    branches: [main]
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    outputs:
      deploy: ${{ steps.compare.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Compare the site with the deployed one
        id: compare
        run: |
          site=https://html-now.github.io
          # A file that's missing from the deployed site, or that fails to download, counts as changed.
          same() { cmp -s <(curl -fsS "$site/$1" | jq -S "$2") <(jq -S "$2" "_site/$1"); }
          if [ "$GITHUB_EVENT_NAME" = schedule ] \
            && same data/specs.json 'del(.sources.built)' \
            && same data/panels/missing.json . && same data/panels/mdn.json . \
            && same data/panels/caniuse.json . && same data/panels/wpt.json .; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Keep the hourly schedule turned on
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/enable"
      - uses: actions/upload-pages-artifact@v5
        if: steps.compare.outputs.deploy == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
